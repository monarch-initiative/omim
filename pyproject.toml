[project]
name = "omim"
version = "0.1.0"
description = "Parallel OMIM API→LinkML path (additive alongside omim2obo legacy pipeline)"
requires-python = ">=3.10"
dependencies = [
    "linkml>=1.10.0",
    "linkml-owl==0.5.0",
    "linkml-runtime",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rdflib>=6.0.0",
    "requests>=2.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "src/omim"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv.sources]
linkml-runtime = { git = "https://github.com/linkml/linkml.git", subdirectory = "packages/linkml_runtime", rev = "main" }
